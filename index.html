<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好姊妹好習慣同盟</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 Firebase SDK (CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 您的 Firebase 專案設定
        const firebaseConfig = {
          apiKey: "AIzaSyALfhe_an6E86eAUWN6s3UHY40AITCec0c",
          authDomain: "fellow-sisters.firebaseapp.com",
          projectId: "fellow-sisters",
          storageBucket: "fellow-sisters.firebasestorage.app",
          messagingSenderId: "526600785432",
          appId: "1:526600785432:web:bdb3f4b55eab5dfdbb3d6d"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 隨機打氣話語清單
        const cheers = [
            "✨ 今天的堅持，是明天自信的來源！加油！",
            "💪 一小步的一小步，累積起來就是巨大的改變！",
            "🌸 好姊妹們都在看著妳呢，今天也要順利打卡喔！",
            "☕ 累了就休息一下，但別放棄心中的好習慣！",
            "🌟 妳比自己想像的還要更有毅力！",
            "💖 每一天的進步都是給自己最好的禮物！"
        ];

        function showRandomCheer() {
            const randomMsg = cheers[Math.floor(Math.random() * cheers.length)];
            const cheerEl = document.getElementById('cheer-message');
            if (cheerEl) cheerEl.innerText = randomMsg;
        }

        // 頁面載入後初始化
        window.addEventListener('DOMContentLoaded', () => {
            showRandomCheer();
            initHabitApp(db);
        });

        function initHabitApp(db) {
            const progressListEl = document.getElementById('progress-list');
            const form = document.getElementById('habit-form');
            const weekFilter = document.getElementById('week-filter');

            // 監聽即時動態與歷史紀錄
            function loadHabits(selectedWeek = "all") {
                const q = query(collection(db, "habits"), orderBy("timestamp", "desc"));
                
                onSnapshot(q, (snapshot) => {
                    progressListEl.innerHTML = "";
                    let hasData = false;

                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        
                        // 如果有篩選週次，進行過濾
                        if (selectedWeek !== "all" && data.week !== selectedWeek) {
                            return;
                        }

                        hasData = true;
                        const dateStr = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleString() : "剛剛";

                        const item = document.createElement('div');
                        item.className = "p-3 bg-pink-50/70 rounded-xl border border-pink-100 flex justify-between items-center shadow-xs";
                        item.innerHTML = `
                            <div>
                                <div class="flex items-center space-x-2">
                                    <span class="font-bold text-pink-700">${escapeHtml(data.name)}</span> 
                                    <span class="text-xs bg-pink-200 text-pink-800 px-2 py-0.5 rounded-full">${escapeHtml(data.week)}</span>
                                </div>
                                <p class="text-sm text-gray-700 mt-1">🎯 習慣：${escapeHtml(data.habitName)}</p>
                                <span class="text-[10px] text-gray-400">${dateStr}</span>
                            </div>
                            <span class="text-xs bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full font-medium">已打卡 ✓</span>
                        `;
                        progressListEl.appendChild(item);
                    });

                    if (!hasData) {
                        progressListEl.innerHTML = `<p class="text-gray-400 text-sm text-center py-6">目前這個週次還沒有打卡記錄，快來搶頭香吧！</p>`;
                    }
                });
            }

            // 初始載入全部進度
            loadHabits("all");

            // 切換週次過濾檢視過去記錄
            weekFilter.addEventListener('change', (e) => {
                loadHabits(e.target.value);
            });

            // 處理表單提交（打卡）
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('user-name').value.trim();
                const habitName = document.getElementById('habit-desc').value.trim();
                const week = document.getElementById('week-select').value;

                try {
                    await addDoc(collection(db, "habits"), {
                        name: name,
                        habitName: habitName,
                        week: week,
                        timestamp: new Date()
                    });
                    
                    // 清空表單的習慣內容，保留名字方便連續打卡
                    document.getElementById('habit-desc').value = "";
                    alert("打卡成功！已同步給所有好姊妹 🎉");
                } catch (e) {
                    console.error("寫入錯誤: ", e);
                    alert("打卡失敗，請檢查網路或 Firebase 設定。");
                }
            });
        }

        // 簡單防 XSS
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</head>
<body class="bg-pink-50/45 min-h-screen font-sans text-gray-800">
    <div class="max-w-xl mx-auto p-4 sm:p-6 space-y-6">
        
        <!-- 標題與隨機打氣 -->
        <header class="text-center space-y-2">
            <h1 class="text-2xl sm:text-3xl font-black text-pink-600 tracking-wide">💖 好姊妹好習慣同盟</h1>
            <div id="cheer-message" class="text-xs sm:text-sm text-pink-600 bg-pink-100/80 py-2 px-4 rounded-full inline-block shadow-xs font-medium">
                載入溫馨打氣中...
            </div>
        </header>

        <!-- 打卡輸入表單 -->
        <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-pink-100">
            <h2 class="font-bold text-lg mb-4 text-gray-700 flex items-center">📝 今日習慣打卡</h2>
            <form id="habit-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">妳的名字 / 暱稱</label>
                    <input type="text" id="user-name" required class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm" placeholder="例如：小美">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">選擇打卡週次</label>
                    <select id="week-select" class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm bg-white">
                        <option value="第 1 週">第 1 週</option>
                        <option value="第 2 週">第 2 週</option>
                        <option value="第 3 週">第 3 週</option>
                        <option value="第 4 週">第 4 週</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">完成的習慣內容</label>
                    <input type="text" id="habit-desc" required class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm" placeholder="例如：喝水 2000cc、閱讀 20 分鐘、運動 30 分鐘">
                </div>
                <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 rounded-xl transition shadow-md shadow-pink-200 cursor-pointer">
                    送出打卡，同步給姊妹們 🚀
                </button>
            </form>
        </div>

        <!-- 歷史進度與即時動態展示區 -->
        <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-pink-100 space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                <h2 class="font-bold text-lg text-gray-700">👀 同盟動態與歷史紀錄</h2>
                <!-- 週次篩選下拉選單 -->
                <div class="flex items-center space-x-2 w-full sm:w-auto">
                    <span class="text-xs font-medium text-gray-500 whitespace-nowrap">檢視週次：</span>
                    <select id="week-filter" class="px-3 py-1.5 border border-gray-200 rounded-lg text-xs bg-white focus:outline-none focus:ring-2 focus:ring-pink-400">
                        <option value="all">全部顯示 (即時動態)</option>
                        <option value="第 1 週">第 1 週</option>
                        <option value="第 2 週">第 2 週</option>
                        <option value="第 3 週">第 3 週</option>
                        <option value="第 4 週">第 4 週</option>
                    </select>
                </div>
            </div>

            <!-- 動態列表 -->
            <div id="progress-list" class="space-y-3">
                <p class="text-gray-400 text-sm text-center py-6">正在同步最新進度...</p>
            </div>
        </div>

    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ 姊妹習慣打卡與表現榜</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #fce4ec; color: #333; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 8px; margin: 0; }
    .container { background: #ffffff; width: 100%; max-width: 500px; border-radius: 20px; box-shadow: 0 8px 24px rgba(233, 30, 99, 0.12); overflow: hidden; display: flex; flex-direction: column; height: 95vh; max-height: 850px; }
    
    header { background: linear-gradient(135deg, #f06292, #ec407a); color: white; padding: 16px; text-align: center; }
    header h1 { font-size: 1.25rem; margin-bottom: 4px; }
    header p { font-size: 0.85rem; opacity: 0.9; }
    
    .date-picker-bar { background: #f8bbd0; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; font-size: 0.9rem; color: #880e4f; font-weight: bold; }
    .date-picker-bar select { padding: 4px 8px; border-radius: 6px; border: 1px solid #c2185b; background: #fff; color: #880e4f; font-weight: bold; }

    .nav-tabs { display: flex; background: #f8bbd0; }
    .nav-tabs button { flex: 1; padding: 10px; border: none; background: transparent; font-weight: bold; color: #880e4f; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
    .nav-tabs button.active { background: #ffffff; color: #d81b60; border-bottom: 3px solid #d81b60; }

    .content-area { flex: 1; overflow-y: auto; padding: 16px; background: #fff5f8; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: #ffffff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #f8bbd0; }
    .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .user-name { font-size: 1.05rem; font-weight: bold; color: #c2185b; }
    .cheers-btn { background: #ffebee; border: 1px solid #ff8a80; color: #d32f2f; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .cheers-btn:active { transform: scale(0.95); }

    .habits-list { display: flex; flex-direction: column; gap: 8px; }
    .habit-item { display: flex; align-items: center; justify-content: space-between; background: #fafafa; padding: 8px 12px; border-radius: 8px; border: 1px solid #eee; }
    .habit-text { font-size: 0.9rem; color: #444; }
    .check-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #ccc; background: white; color: transparent; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .check-btn.checked { background: #66bb6a; border-color: #66bb6a; color: white; }

    .ranking-list { display: flex; flex-direction: column; gap: 10px; }
    .rank-card { display: flex; align-items: center; background: white; padding: 12px 16px; border-radius: 10px; border: 1px solid #fce4ec; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
    .rank-num { font-size: 1.1rem; font-weight: bold; width: 30px; color: #ad1457; }
    .rank-info { flex: 1; }
    .rank-name { font-weight: bold; font-size: 0.95rem; color: #333; }
    .rank-score { font-size: 0.8rem; color: #666; margin-top: 2px; }
    .rank-badge { background: #f8bbd0; color: #880e4f; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }

    .my-profile-select { margin-bottom: 14px; background: #fff; padding: 10px 14px; border-radius: 10px; border: 1px solid #f8bbd0; display: flex; align-items: center; justify-content: space-between; }
    .my-profile-select select { padding: 4px 8px; border-radius: 6px; border: 1px solid #c2185b; color: #880e4f; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>✨ 姊妹習慣打卡</h1>
      <p>互相支持，一起變好！</p>
    </header>

    <div class="date-picker-bar">
      <span>📅 選擇每週日期：</span>
      <select id="weekDateSelect" onchange="changeWeekDate()">
        <!-- 動態產生 11月至12月週一日期 -->
      </select>
    </div>

    <div class="nav-tabs">
      <button class="active" onclick="switchTab(0)">今週表現榜</button>
      <button onclick="switchTab(1)">每週打卡牆</button>
    </div>

    <div class="content-area">
      <!-- 標籤 1：今週表現榜 -->
      <div id="tab-0" class="tab-content active">
        <div class="ranking-list" id="rankingListContainer"></div>
      </div>

      <!-- 標籤 2：每週打卡牆 -->
      <div id="tab-1" class="tab-content">
        <div class="my-profile-select">
          <span>我是：</span>
          <select id="currentUserSelect" onchange="renderApp()"></select>
        </div>
        <div id="cardsContainer"></div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyALfhe_an6E86eAUWN6s3UHY40AITCec0c",
      authDomain: "fellow-sisters.firebaseapp.com",
      projectId: "fellow-sisters",
      storageBucket: "fellow-sisters.firebasestorage.app",
      messagingSenderId: "526600785432",
      appId: "1:526600785432:web:bdb3f4b55eab5dfdbb3d6d"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const users = [
      "Amy", "Bella", "Cathy", "Daisy", "Eva", "Fiona", 
      "Grace", "Hannah", "Iris", "Joy", "Kelly", "Luna"
    ];

    const habits = [
      "早起喝一杯溫水",
      "運動/伸展 20 分鐘",
      "閱讀 15 分鐘",
      "12點前就寢"
    ];

    let selectedDate = '2026-11-02';
    let dbData = { usersData: {}, cheers: {} };

    function initDatePicker() {
      const select = document.getElementById('weekDateSelect');
      select.innerHTML = '';
      let startDate = new Date('2026-11-02');
      let endDate = new Date('2026-12-31');

      let current = new Date(startDate);
      while(current <= endDate) {
        let dateString = current.toISOString().split('T')[0];
        let opt = document.createElement('option');
        opt.value = dateString;
        opt.text = `${dateString} (週一)`;
        select.appendChild(opt);
        current.setDate(current.getDate() + 7);
      }
      select.value = selectedDate;
    }

    function changeWeekDate() {
      selectedDate = document.getElementById('weekDateSelect').value;
      fetchDataAndRender();
    }

    function initUserSelect() {
      const select = document.getElementById('currentUserSelect');
      select.innerHTML = '';
      users.forEach(name => {
        let opt = document.createElement('option');
        opt.value = name;
        opt.text = name;
        select.appendChild(opt);
      });
    }

    function fetchDataAndRender() {
      db.collection("habitData").doc(selectedDate).get().then((doc) => {
        if (doc.exists) {
          dbData = doc.data();
        } else {
          dbData = { usersData: {}, cheers: {} };
        }
        renderApp();
      }).catch((error) => {
        console.log("Error getting document:", error);
      });
    }

    function saveToFirebase() {
      db.collection("habitData").doc(selectedDate).set(dbData)
        .then(() => { renderApp(); })
        .catch((error) => { console.error("Error writing document: ", error); });
    }

    function switchTab(index) {
      const buttons = document.querySelectorAll('.nav-tabs button');
      const tabs = document.querySelectorAll('.tab-content');
      buttons.forEach((btn, idx) => {
        btn.classList.toggle('active', idx === index);
        tabs[idx].classList.toggle('active', idx === index);
      });
    }

    function toggleHabit(userName, habitIdx) {
      if (!dbData.usersData[userName]) dbData.usersData[userName] = {};
      dbData.usersData[userName][habitIdx] = !dbData.usersData[userName][habitIdx];
      saveToFirebase();
    }

    function addCheers(userName) {
      if (!dbData.cheers) dbData.cheers = {};
      dbData.cheers[userName] = (dbData.cheers[userName] || 0) + 1;
      saveToFirebase();
    }

    function renderApp() {
      const currentUser = document.getElementById('currentUserSelect').value;
      
      const cardsContainer = document.getElementById('cardsContainer');
      cardsContainer.innerHTML = '';

      users.forEach(name => {
        if (!dbData.usersData[name]) dbData.usersData[name] = {};
        if (!dbData.cheers) dbData.cheers = {};
        const userCheers = dbData.cheers[name] || 0;

        let habitsHtml = '';
        habits.forEach((habit, hIdx) => {
          const isChecked = !!dbData.usersData[name][hIdx];
          habitsHtml += `
            <div class="habit-item">
              <span class="habit-text">${habit}</span>
              <button class="check-btn ${isChecked ? 'checked' : ''}" onclick="toggleHabit('${name}', ${hIdx})">✓</button>
            </div>
          `;
        });

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="user-header">
            <span class="user-name">${name} ${name === currentUser ? '(我)' : ''}</span>
            <button class="cheers-btn" onclick="addCheers('${name}')">❤️ 打氣 (${userCheers})</button>
          </div>
          <div class="habits-list">${habitsHtml}</div>
        `;
        cardsContainer.appendChild(card);
      });

      const rankingContainer = document.getElementById('rankingListContainer');
      rankingContainer.innerHTML = '';

      let stats = users.map(name => {
        let completed = 0;
        if (dbData.usersData[name]) {
          completed = Object.values(dbData.usersData[name]).filter(Boolean).length;
        }
        let cheers = dbData.cheers && dbData.cheers[name] ? dbData.cheers[name] : 0;
        return { name, completed, cheers };
      });

      stats.sort((a, b) => b.completed - a.completed || b.cheers - a.cheers);

      stats.forEach((item, index) => {
        let rankHtml = `
          <div class="rank-card">
            <div class="rank-num">#${index + 1}</div>
            <div class="rank-info">
              <div class="rank-name">${item.name}</div>
              <div class="rank-score">已完成 ${item.completed} / ${habits.length} 項目標 | 獲打氣 ❤️ ${item.cheers}</div>
            </div>
            <div class="rank-badge">${item.completed === habits.length ? '👑 完美週' : `${Math.round((item.completed/habits.length)*100)}%`}</div>
          </div>
        `;
        rankingContainer.innerHTML += rankHtml;
      });
    }

    initDatePicker();
    initUserSelect();
    fetchDataAndRender();
  </script>
</body>
</html>
